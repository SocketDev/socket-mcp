name: GitHub release
run-name: GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to finalize after npm publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.repository }}-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-26.04
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify existing release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if ! [[ "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo '::error::Tag is not a safe version tag.'
            exit 1
          fi
          VERSION="${TAG#v}"
          test "$(node -p "require('./package.json').name")" = '@socketsecurity/mcp'
          TAG_MANIFEST="$(git show "refs/tags/${TAG}:package.json")"
          test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).name)' "${TAG_MANIFEST}")" = '@socketsecurity/mcp'
          test "$(node -e 'process.stdout.write(JSON.parse(process.argv[1]).version)' "${TAG_MANIFEST}")" = "${VERSION}"
          TAG_SHA="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_SHA}" --jq '.commit.verification.verified')" = true
          git merge-base --is-ancestor "${TAG_SHA}" "origin/${DEFAULT_BRANCH}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      # npm lifecycle: validating waits; staged is approved locally with 2FA;
      # published becomes available; blocked or deleted versions stop. An
      # anonymous HEAD 404 cannot distinguish pending, blocked, deleted, or
      # missing versions. A timeout preserves the version for retry.
      - name: Wait for exact npm version
        run: node scripts/repo/npm/availability.mts "${VERSION}"
        env:
          VERSION: ${{ steps.release.outputs.version }}
      - name: Create or finish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --draft=false
          else
            git show "refs/tags/${TAG}:CHANGELOG.md" | awk -v version="${TAG#v}" 'index($0, "## [" version "]") == 1 { found=1; print; next } found && /^## / { exit } found { print }' > release-notes.md
            test -s release-notes.md
            gh release create "${TAG}" --draft --verify-tag --notes-file release-notes.md
            gh release edit "${TAG}" --draft=false
          fi
