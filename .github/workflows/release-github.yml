name: '🚀 GitHub release'
run-name: '🚀 GitHub release'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: Publish the GitHub release. False prints the release plan.
        required: true
        type: boolean
        default: false
      tag:
        description: Existing version tag. Tag pushes use the pushed tag.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version and tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${INPUT_TAG:-${REF_NAME}}"
          if [ "${TAG}" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match package version ${VERSION}."
            exit 1
          fi
          if ! git rev-parse --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} is not present in this checkout."
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Check npm publication
        if: ${{ github.event_name == 'push' || inputs.release }}
        working-directory: ${{ runner.temp }}
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: npm view "@socketsecurity/mcp@${VERSION}" version
      - name: Print release plan
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.release }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          echo "Dry run: publish GitHub release ${TAG} for npm version ${VERSION}."
      - name: Publish GitHub release
        if: ${{ github.event_name == 'push' || inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" --draft --verify-tag --generate-notes
          gh release edit "${TAG}" --draft=false
