name: 'release: npm record'
run-name: 'release: npm record (${{ inputs.version }})'

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Package name to abandon. Leave empty when all-packages is true.'
        required: false
        type: string
        default: ''
      version:
        description: 'Unpublished version to permanently reserve as abandoned.'
        required: true
        type: string
      reason:
        description: 'Reason for permanently burning this unpublished version.'
        required: true
        type: string
      all-packages:
        description: 'Record abandonment for every publishable npm workspace package.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release-record-${{ github.repository }}
  cancel-in-progress: false

jobs:
  record:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    name: Record npm abandonment
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="http.${SERVER_URL}/.extraheader"
            export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_B64}"
            git fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
          install -m 0600 scripts/fleet/release/record/run.mts "$RUNNER_TEMP/npm-release-record-run.mts"
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          checkout-ref: ${{ github.sha }}
      - name: Restore trusted release-record controller
        shell: bash
        run: install -m 0600 "$RUNNER_TEMP/npm-release-record-run.mts" scripts/fleet/release/record/run.mts
      - name: Mint release token
        id: release-app
        uses: ./.github/actions/fleet/github-release-ledger-app-token
        with:
          client-id: ${{ secrets.SOCKET_RELEASE_CLIENT_ID || vars.SOCKET_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOCKET_RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
      - name: Record abandoned version
        env:
          GH_TOKEN: ${{ steps.release-app.outputs.token }}
          RELEASE_LEDGER_TOKEN: ${{ steps.release-app.outputs.token }}
          ALL_PACKAGES: ${{ inputs.all-packages }}
          PACKAGE_NAME: ${{ inputs.name }}
          RELEASE_REASON: ${{ inputs.reason }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if [ "$ALL_PACKAGES" = true ] && [ -n "$PACKAGE_NAME" ]; then
            echo "PACKAGE_NAME must be empty when ALL_PACKAGES is true." >&2
            exit 1
          fi
          if [ "$ALL_PACKAGES" = true ]; then
            pnpm run npm:release-record --abandon --record-only --all-packages --version "$RELEASE_VERSION" --reason "$RELEASE_REASON"
          else
            pnpm run npm:release-record --abandon --record-only --name "$PACKAGE_NAME" --version "$RELEASE_VERSION" --reason "$RELEASE_REASON"
          fi
